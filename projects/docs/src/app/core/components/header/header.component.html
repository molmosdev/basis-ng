<div class="header-wrapper">
  <button
    b-button
    variant="ghost"
    size="small"
    [equalPadding]="true"
    [routerLink]="['/']">
    <i b-icon icon="CircleDotDashed" [size]="22"></i>
  </button>
  <div class="right">
    <button
      b-button
      variant="ghost"
      size="small"
      [equalPadding]="true"
      [menuTriggerFor]="themeMenu"
      [menuTriggerPosition]="'bottom-right'">
      @switch (theme()) {
        @case ('auto') {
          <i b-icon [strokeWidth]="1.5" [size]="22" icon="SunMoon"></i>
        }
        @case ('light') {
          <i b-icon [strokeWidth]="1.5" [size]="22" icon="Sun"></i>
        }
        @case ('dark') {
          <i b-icon [strokeWidth]="1.5" [size]="22" icon="Moon"></i>
        }
      }
    </button>
    <ng-template #themeMenu>
      <b-menu>
        <b-menu-group>
          <b-menu-item-radio
            [active]="theme() === 'auto'"
            (triggered)="applyTheme('auto')">
            <i b-icon [strokeWidth]="1.5" [size]="22" icon="SunMoon"></i>
            Auto
          </b-menu-item-radio>
          <b-menu-item-radio
            [active]="theme() === 'light'"
            (triggered)="applyTheme('light')">
            <i b-icon [strokeWidth]="1.5" [size]="22" icon="Sun"></i>
            Light
          </b-menu-item-radio>
          <b-menu-item-radio
            [active]="theme() === 'dark'"
            (triggered)="applyTheme('dark')">
            <i b-icon [strokeWidth]="1.5" [size]="20" icon="Moon"></i>
            Dark
          </b-menu-item-radio>
        </b-menu-group>
      </b-menu>
    </ng-template>
  </div>
</div>
