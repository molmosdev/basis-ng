<div class="header-wrapper">
  <img src="/svg/logo.svg" alt="" [routerLink]="['/']" class="logo" />
  <div class="right">
    <a
      href="https://github.com/molmosdev/basis-ng"
      target="_blank"
      rel="noopener">
      <button b-button variant="ghost" size="2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24">
          <g transform="scale(0.8333) translate(2 2)">
            <path
              fill="currentColor"
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
          </g>
        </svg>
      </button>
    </a>
    <a href="https://www.npmjs.com/org/basis-ng" target="_blank" rel="noopener">
      <button b-button variant="ghost" size="2">
        <i b-icon icon="Package" [size]="22" [strokeWidth]="1.6"></i>
      </button>
    </a>
    <button
      b-button
      variant="ghost"
      size="2"
      [menuTriggerFor]="themeMenu"
      [menuTriggerPosition]="'bottom-right'">
      @switch (theme()) {
        @case ('auto') {
          <i b-icon [strokeWidth]="1.5" [size]="22" icon="SunMoon"></i>
        }
        @case ('light') {
          <i b-icon [strokeWidth]="1.5" [size]="22" icon="Sun"></i>
        }
        @case ('dark') {
          <i b-icon [strokeWidth]="1.5" [size]="22" icon="Moon"></i>
        }
      }
    </button>
    <ng-template #themeMenu>
      <b-menu>
        <b-menu-group>
          <b-menu-item-radio
            [active]="theme() === 'auto'"
            (triggered)="applyTheme('auto')">
            <i b-icon [strokeWidth]="1.5" [size]="22" icon="SunMoon"></i>
            Auto
          </b-menu-item-radio>
          <b-menu-item-radio
            [active]="theme() === 'light'"
            (triggered)="applyTheme('light')">
            <i b-icon [strokeWidth]="1.5" [size]="22" icon="Sun"></i>
            Light
          </b-menu-item-radio>
          <b-menu-item-radio
            [active]="theme() === 'dark'"
            (triggered)="applyTheme('dark')">
            <i b-icon [strokeWidth]="1.5" [size]="20" icon="Moon"></i>
            Dark
          </b-menu-item-radio>
        </b-menu-group>
      </b-menu>
    </ng-template>
  </div>
</div>
