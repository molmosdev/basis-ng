@if (currentDevice() === 'mobile') {
  <b-bottom-sheet [(isOpen)]="navigationService.bottomSheetOpen" height="65dvh">
    <ng-container *ngTemplateOutlet="menu" />
  </b-bottom-sheet>
} @else {
  <ng-container *ngTemplateOutlet="menu" />
}

<ng-template #menu>
  <div class="menu-wrapper">
    <b-menu>
      <b-menu-label>Getting started</b-menu-label>
      @for (route of documentationRoutes(); track route) {
        @if (route.data) {
          <button
            b-menu-item-radio
            [routerLink]="route.path"
            [routerLinkActive]="['active']"
            (click)="navigationService.bottomSheetOpen.set(false)">
            {{ route.data['title'] }}
            @if (route.data['new']) {
              <span b-badge variant="outlined" size="small"> New </span>
            }
          </button>
        }
      }
      <b-menu-label>Components</b-menu-label>
      @for (route of componentsRoutes(); track route) {
        @if (route.data) {
          @let path = '/documentation/components/' + route.path;
          <button
            b-menu-item-radio
            [routerLink]="path"
            [routerLinkActive]="['active']"
            (click)="navigationService.bottomSheetOpen.set(false)">
            {{ route.data['title'] }}
            @if (route.data['new']) {
              <span b-badge variant="outlined" size="small"> New </span>
            }
          </button>
        }
      }
    </b-menu>
  </div>
</ng-template>
