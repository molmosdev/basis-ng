@if (currentDevice() === 'mobile') {
  <div class="mobile-menu-trigger">
    <button
      b-button
      variant="outlined"
      size="3"
      (click)="bottomSheetOpen.set(true)">
      @let data = currentRoute().data;
      @if (data && data['title']) {
        {{ data['title'] }}
      }
      <div class="chevron-wrapper">
        <i b-icon icon="ChevronUp" [size]="12" class="icon-chevron-up"></i>
        <i b-icon icon="ChevronDown" [size]="12" class="icon-chevron-down"></i>
      </div>
    </button>
  </div>
  <b-bottom-sheet [(isOpen)]="bottomSheetOpen" height="65dvh">
    <ng-container *ngTemplateOutlet="menu" />
  </b-bottom-sheet>
} @else {
  <ng-container *ngTemplateOutlet="menu" />
}

<ng-template #menu>
  <div class="menu-wrapper">
    <b-menu>
      <b-menu-label>Getting started</b-menu-label>
      @for (route of documentationRoutes(); track route) {
        @if (route.data) {
          <button
            b-menu-item-radio
            [routerLink]="route.path"
            [routerLinkActive]="['active']"
            (click)="this.bottomSheetOpen.set(false)">
            {{ route.data['title'] }}
            @if (route.data['new']) {
              <span b-badge variant="outlined" size="small"> New </span>
            }
          </button>
        }
      }
      <b-menu-label>Components</b-menu-label>
      @for (route of componentsRoutes(); track route) {
        @if (route.data) {
          @let path = '/documentation/components/' + route.path;
          <button
            b-menu-item-radio
            [routerLink]="path"
            [routerLinkActive]="['active']"
            (click)="this.bottomSheetOpen.set(false)">
            {{ route.data['title'] }}
            @if (route.data['new']) {
              <span b-badge variant="outlined" size="small"> New </span>
            }
          </button>
        }
      }
    </b-menu>
  </div>
</ng-template>
